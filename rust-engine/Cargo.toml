[package]
name = "symplex-engine"
version = "1.5.1"
edition = "2021"
description = "SympleX Polyhedral Tensor Superoptimizer – Rust Engine with x86-64 JIT"

[lib]
name = "symplex_engine"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
libc = "0.2"
rustc-hash = "2"
lazy_static = "1.5"
rayon = "1.10"
num_cpus = "1.16"
iced-x86 = { version = "1", features = ["code_asm"] }
cudarc = { version = "0.19", optional = true }
egg = "0.6"
good_lp = { version = "1.3", features = ["minilp"], default-features = false }

[features]
default = ["blas"]
cuda = ["cudarc"]
blas = []
jit_trace = []  # Enable JIT compilation trace logging (off by default for performance)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
